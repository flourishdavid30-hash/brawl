<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Brawl</title>
<style>
  html,body{height:100%;margin:0;background:#101418;color:#fff;font-family:sans-serif;
            overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  #stage{display:block;margin:0 auto;background:linear-gradient(#1b2a33,#0d1418)}
  .pad{position:fixed;bottom:0;left:0;right:0;height:132px;display:flex;
       align-items:center;justify-content:space-between;padding:0 10px 12px}
  .grp{display:flex;gap:10px}
  button{width:64px;height:64px;border-radius:50%;border:0;background:#2b3a44;color:#fff;
         font-size:13px;font-weight:bold;letter-spacing:1px}
  button:active{background:#4a6472}
  #hit{background:#c0392b}#kick{background:#d4770b}#blk{background:#2c6e49}
  #over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
        flex-direction:column;background:rgba(0,0,0,.75);font-size:26px;font-weight:bold}
  #over small{font-size:14px;font-weight:normal;opacity:.8;margin-top:10px}
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="pad">
  <div class="grp">
    <button id="L">◀</button><button id="R">▶</button>
  </div>
  <div class="grp">
    <button id="blk">BLOCK</button><button id="kick">KICK</button><button id="hit">HIT</button>
  </div>
</div>

<div id="over">YOU WIN<small>Tap to fight again</small></div>

<script>
var c = document.getElementById("stage"), g = c.getContext("2d");
var W = 400, H = 300, ground = 250;

function fit() {
  var s = Math.min(window.innerWidth / W, (window.innerHeight - 132) / H);
  c.width = W * s; c.height = H * s; c.style.width = c.width + "px";
  g.setTransform(s, 0, 0, s, 0, 0);
}
window.addEventListener("resize", fit); fit();

/* ---- fighter factory ---- */
function fighter(x, facing, colour) {
  return { x: x, vx: 0, hp: 100, face: facing, colour: colour,
           attack: 0, cool: 0, block: false, hurt: 0, anim: 0 };
}
var p, e, round = 1, wins = 0, timeLeft = 60, msg = "", msgT = 0, running = true;

function reset() {
  p = fighter(90, 1, "#e8eef2");
  e = fighter(310, -1, "#d98c5f");
  timeLeft = 60; running = true;
  document.getElementById("over").style.display = "none";
}
reset();

/* ---- input ---- */
var keys = {};
function hold(id, on, off) {
  var b = document.getElementById(id);
  b.addEventListener("pointerdown", function (ev) { ev.preventDefault(); on(); }, { passive: false });
  b.addEventListener("pointerup",   function (ev) { ev.preventDefault(); off(); }, { passive: false });
  b.addEventListener("pointerleave", off);
}
hold("L", function () { keys.l = 1 }, function () { keys.l = 0 });
hold("R", function () { keys.r = 1 }, function () { keys.r = 0 });
hold("blk", function () { if (p) p.block = true }, function () { if (p) p.block = false });
hold("hit",  function () { swing(p, e, 7, 14) }, function () {});
hold("kick", function () { swing(p, e, 12, 20) }, function () {});

function swing(a, b, reach, dmg) {
  if (!a || !running || a.cool > 0) return;
  a.attack = 0.22; a.cool = (dmg > 10 ? 0.55 : 0.35);
  var d = Math.abs(a.x - b.x);
  if (d > reach) return;
  if (b.block) { bump(b, a, dmg * 0.15); flash("BLOCKED"); return; }
  b.hp -= dmg; b.hurt = 0.25; bump(b, a, dmg);
  if (navigator.vibrate) navigator.vibrate(dmg > 10 ? 45 : 20);
  if (dmg > 10) flash("HEAVY!");
}
function bump(victim, from, force) {
  victim.x += (victim.x >= from.x ? 1 : -1) * Math.min(26, 6 + force);
  victim.x = Math.max(24, Math.min(W - 24, victim.x));
}
function flash(t) { msg = t; msgT = 0.7; }

/* ---- opponent brain ---- */
var think = 0;
function ai(f, foe, dt) {
  think -= dt;
  var d = foe.x - f.x, ad = Math.abs(d);
  f.face = d >= 0 ? 1 : -1;
  if (f.cool > 0.3) { f.block = true; } else { f.block = false; }

  if (think <= 0) {
    think = 0.25 + Math.random() * 0.4;
    if (ad > 46) f.plan = "in";
    else f.plan = Math.random() < 0.62 ? "attack" : (Math.random() < 0.5 ? "back" : "block");
  }
  if (f.plan === "in")  f.x += 62 * dt * (d >= 0 ? 1 : -1);
  if (f.plan === "back") f.x -= 55 * dt * (d >= 0 ? 1 : -1);
  if (f.plan === "attack" && ad < 44 && f.cool <= 0)
    swing(f, foe, Math.random() < 0.3 ? 20 : 14, Math.random() < 0.3 ? 12 : 7);
  f.x = Math.max(24, Math.min(W - 24, f.x));
}

/* ---- draw a body ---- */
function draw(f) {
  var x = f.x, y = ground, s = 1 + Math.sin(f.anim) * 0.02;
  var lean = f.attack > 0 ? 8 * f.face : 0;
  if (f.hurt > 0) lean = -6 * f.face;

  g.save();
  g.translate(x, y);

  /* shadow */
  g.fillStyle = "rgba(0,0,0,.35)";
  g.beginPath(); g.ellipse(0, 4, 20, 5, 0, 0, 7); g.fill();

  var body = f.hurt > 0 ? "#ff6b6b" : (f.block ? "#7fd1a4" : f.colour);
  g.fillStyle = body; g.strokeStyle = body; g.lineWidth = 7; g.lineCap = "round";

  /* legs */
  var st = Math.sin(f.anim * 3) * (Math.abs(f.vx) > 0.1 ? 9 : 3);
  line(0, -34, -7 - st, 0); line(0, -34, 7 + st, 0);
  /* torso */
  line(0, -34, lean, -66 * s);
  /* arms: one guards, one punches */
  if (f.attack > 0) {
    line(lean, -58, lean + 30 * f.face, -56);
    line(lean, -56, lean - 8 * f.face, -42);
  } else if (f.block) {
    line(lean, -58, lean + 12 * f.face, -66);
    line(lean, -54, lean + 13 * f.face, -58);
  } else {
    line(lean, -58, lean + 16 * f.face, -46);
    line(lean, -56, lean - 10 * f.face, -44);
  }
  /* head */
  g.fillStyle = body;
  g.beginPath(); g.arc(lean + 2 * f.face, -76 * s, 9, 0, 7); g.fill();
  g.restore();
}
function line(a, b, cc, d) { g.beginPath(); g.moveTo(a, b); g.lineTo(cc, d); g.stroke(); }

function bar(x, w, hp, right) {
  g.fillStyle = "rgba(255,255,255,.18)"; g.fillRect(x, 14, w, 10);
  g.fillStyle = hp > 30 ? "#ffd34d" : "#e05c4a";
  var f = Math.max(0, hp) / 100 * w;
  g.fillRect(right ? x + w - f : x, 14, f, 10);
}

/* ---- loop ---- */
var last = 0;
function frame(t) {
  var dt = Math.min(0.05, (t - last) / 1000); last = t;

  if (running) {
    p.anim += dt * 6; e.anim += dt * 6;
    p.vx = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
    if (!p.block) p.x += p.vx * 92 * dt;
    p.x = Math.max(24, Math.min(W - 24, p.x));
    if (Math.abs(p.x - e.x) < 34) {
      var push = (p.x <= e.x ? -1 : 1) * (34 - Math.abs(p.x - e.x));
      p.x += push; e.x -= push;
    }
    ai(e, p, dt);
    [p, e].forEach(function (f) {
      f.attack = Math.max(0, f.attack - dt);
      f.cool   = Math.max(0, f.cool - dt);
      f.hurt   = Math.max(0, f.hurt - dt);
    });
    timeLeft -= dt; msgT = Math.max(0, msgT - dt);

    if (p.hp <= 0 || e.hp <= 0 || timeLeft <= 0) {
      running = false;
      var youWin = (p.hp > e.hp);
      if (youWin) wins++;
      var o = document.getElementById("over");
      o.firstChild.nodeValue = youWin ? "YOU WIN" : "YOU LOSE";
      o.style.display = "flex";
      localStorage.setItem("brawl-wins", String(wins));
    }
  }

  g.fillStyle = "#0d1418"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#18242b"; g.fillRect(0, ground, W, H - ground);
  g.fillStyle = "rgba(255,255,255,.05)";
  for (var i = 0; i < 8; i++) g.fillRect(i * 52, ground, 2, H - ground);

  draw(e); draw(p);
  bar(12, 160, p.hp, false); bar(W - 172, 160, e.hp, true);
  g.fillStyle = "#fff"; g.font = "bold 12px sans-serif"; g.textAlign = "center";
  g.fillText(Math.ceil(Math.max(0, timeLeft)), W / 2, 24);
  g.font = "10px sans-serif";
  g.fillText("WINS " + wins, W / 2, 38);
  if (msgT > 0) { g.font = "bold 16px sans-serif"; g.fillStyle = "#ffd34d"; g.fillText(msg, W / 2, 70); }

  requestAnimationFrame(frame);
}
requestAnimationFrame(function (t) { last = t; frame(t); });

document.getElementById("over").addEventListener("pointerdown", function () {
  round++; reset();
});
</script>
</body>
  </html>
